packages:
  - packages/*
  # The release scripts (#46), a private package: never published.
  - release
  # The docs site (#40), a private package: never published.
  - website

catalog:
  # typescript-to-lua pins its TypeScript peer exactly; move both together (ADR 0002).
  typescript: 6.0.2
  typescript-to-lua: ^1.37.1
  lua-types: ^2.14.1
  # Globals lua-types relies on (LuaMultiReturn and friends); a Map project lists it in `types` (#11).
  "@typescript-to-lua/language-extensions": ^1.19.0
  vitest: ^5.0.1
  # JSON Schema validator for the library's rename map (migration/renames.schema.json), in the
  # rename map module of the release package (release/src/rename-map.ts) its Node tests import.
  ajv: ^8.20.0
  # Node built-ins for the generator (fs, path); major follows .node-version.
  "@types/node": ^24.0.0
  # Lua 5.3.6 compiled to WebAssembly, the VM typescript-to-lua's own suite runs on; reforged-test executes compiled tests on it (ADR 0002).
  lua-wasm-bindings: ^0.5.3
  # Lint and format (ADR 0002): one ESLint flat configuration at the root.
  # @eslint/js and the TypeScript resolver are not optional: ESLint 10 no
  # longer ships the recommended rules, and import-x's TypeScript preset
  # resolves imports through eslint-import-resolver-typescript.
  eslint: ^10.11.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.70.1
  # eslint-plugin-reforged: the rule creator and type helpers, and the
  # RuleTester its fixtures run on; they move with typescript-eslint.
  "@typescript-eslint/utils": ^8.70.1
  "@typescript-eslint/rule-tester": ^8.70.1
  eslint-plugin-import-x: ^4.17.1
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-prettier: ^5.5.6
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.9
  # The release scripts (#46): the changeset reader Changesets itself uses, and
  # the workspace reader it finds packages with, so the scripts see the same
  # changesets and the same packages as `changeset version`.
  "@changesets/parse": ^1.0.0
  "@manypkg/get-packages": ^3.1.0
  # Changesets drives the versions and the changelogs (#46, ADR 0009); the
  # GitHub generator links each entry to its pull request and its author.
  "@changesets/cli": ^3.0.3
  "@changesets/changelog-github": ^1.0.1
  # The docs site (#40, ADR 0005). Docusaurus checks that its packages share
  # one version, so they are pinned together and move together.
  "@docusaurus/core": 3.10.2
  "@docusaurus/preset-classic": 3.10.2
  "@docusaurus/plugin-content-docs": 3.10.2
  "@docusaurus/faster": 3.10.2
  "@docusaurus/module-type-aliases": 3.10.2
  "@docusaurus/tsconfig": 3.10.2
  "@docusaurus/types": 3.10.2
  "@mdx-js/react": ^3.1.1
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  # The API reference (#40): TypeDoc, its Markdown output and the Docusaurus
  # plugin that runs it into the docs tree. The two plugins follow TypeDoc's
  # minor (their peer ranges name it); move the three together.
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.13.1
  docusaurus-plugin-typedoc: ^1.4.3
