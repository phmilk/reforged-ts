packages:
  - packages/*

catalog:
  # typescript-to-lua pins its TypeScript peer exactly; move both together (ADR 0002).
  typescript: 6.0.2
  typescript-to-lua: ^1.37.1
  lua-types: ^2.14.1
  # Globals lua-types relies on (LuaMultiReturn and friends); a Map project lists it in `types` (#11).
  "@typescript-to-lua/language-extensions": ^1.19.0
  vitest: ^5.0.1
  # JSON Schema validator for the library's rename map (migration/renames.schema.json), in its Node tests.
  ajv: ^8.20.0
  # Node built-ins for the generator (fs, path); major follows .node-version.
  "@types/node": ^24.0.0
  # Lua 5.3.6 compiled to WebAssembly, the VM typescript-to-lua's own suite runs on; reforged-test executes compiled tests on it (ADR 0002).
  lua-wasm-bindings: ^0.5.3
  # Lint and format (ADR 0002): one ESLint flat configuration at the root.
  # @eslint/js and the TypeScript resolver are not optional: ESLint 10 no
  # longer ships the recommended rules, and import-x's TypeScript preset
  # resolves imports through eslint-import-resolver-typescript.
  eslint: ^10.11.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.70.1
  eslint-plugin-import-x: ^4.17.1
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-prettier: ^5.5.6
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.9
