# The docs site: every push to master deploys "Next" to GitHub Pages. The
# docs version of each reforged-ts minor is cut by docs-cut.yml, which
# release.yml calls after publishing it; a dispatch of this workflow
# rehearses the cut. website/README.md, "Docs versions", describes the cut;
# docs/release.md, "The docs workflow", the jobs and the rehearsal.
name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Rehearsal: cut the docs version of this reforged-ts version (such
          as 1.99.0) from master, and open its pull request with auto-merge
          off. Close the pull request and delete its branch. From master
          only: the cut's job runs in the environment app.
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy-next:
    name: deploy-next
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The Pages deployment action exchanges the job's OIDC token.
      pages: write
      id-token: write
    # Deployments serialise and are never cancelled; a newer push waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: this job deploys the site, and never restores a
      # cache another workflow could have written.
      - uses: ./.github/actions/setup-workspace
      # The packages the site reads: the Typings and the library, whose
      # declarations TypeDoc reads, and the rest of its dependencies.
      - name: Build the packages the site reads
        run: pnpm --filter "reforged-ts-website^..." build
      - name: docs:build
        run: pnpm run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The rehearsal of the cut release.yml runs: the same workflow, from the
  # dispatched ref, which the environment app refuses unless it is master.
  cut-version:
    name: cut-version
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-cut.yml
    with:
      tag: reforged-ts@${{ inputs.version }}
      rehearsal: true
