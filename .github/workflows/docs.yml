# The docs site: every push to master deploys "Next" to GitHub Pages, and
# every reforged-ts minor tag cuts a docs version through a pull request the
# App opens with auto-merge, whose merge deploys it. website/README.md, "Docs
# versions", describes the cut; docs/release.md, "The docs workflow", the
# jobs and the rehearsal.
name: docs

on:
  push:
    branches: [master]
    # The publish job of release.yml tags each published package with the
    # App's token, so the tags trigger this workflow. The filter cannot
    # tell a minor from a patch or a prerelease: cut-version decides.
    tags: ["reforged-ts@*"]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Rehearsal: cut the docs version of this reforged-ts version (such
          as 1.99.0) from the dispatched ref, and open its pull request with
          auto-merge off. Close the pull request and delete its branch.
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy-next:
    name: deploy-next
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The Pages deployment action exchanges the job's OIDC token.
      pages: write
      id-token: write
    # Deployments serialise and are never cancelled; a newer push waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: this job deploys the site, and never restores a
      # cache another workflow could have written.
      - uses: ./.github/actions/setup-workspace
      # The packages the site reads: the Typings and the library, whose
      # declarations TypeDoc reads, and the rest of its dependencies.
      - name: Build the packages the site reads
        run: pnpm --filter "reforged-ts-website^..." build
      - name: docs:build
        run: pnpm run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  cut-version:
    name: cut-version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/reforged-ts@')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # The tag's commit: the docs are frozen as the release left them. A
      # rehearsal cuts from the dispatched ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Minted before any code of the checkout runs (the install's lifecycle
      # scripts, the check, the build), so none of it can rewrite the local
      # action that receives the App's private key; minted even when the tag
      # cuts nothing. The App pushes the branch and opens the pull request,
      # so CI runs on it.
      - id: app
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # No dependency cache: this job holds the App token.
      - uses: ./.github/actions/setup-workspace
      # Only reforged-ts@<major>.<minor>.0 cuts a docs version; any other
      # tag ends the job here with a notice.
      - id: cut
        name: release:docs-cut
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REHEARSAL" = true ]; then
            tag="reforged-ts@$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          decision=$(pnpm --silent release:docs-cut "$tag")
          echo "$decision"
          if [ "$(jq -r .cut <<< "$decision")" = true ]; then
            version=$(jq -r .version <<< "$decision")
            label=$(jq -r .label <<< "$decision")
            {
              echo "version=$version"
              echo "label=$label"
              echo "branch=docs-version/$version"
            } >> "$GITHUB_OUTPUT"
            echo "## Docs version $label, from $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            reason=$(jq -r .reason <<< "$decision")
            echo "::notice title=No docs version::$reason"
            printf '## No docs version\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the packages the site reads
        if: steps.cut.outputs.version != ''
        run: pnpm --filter "reforged-ts-website^..." build
      # Freezes Next as the docs version, then keeps the last three minors
      # of each major.
      - name: docs:version
        if: steps.cut.outputs.version != ''
        env:
          LABEL: ${{ steps.cut.outputs.label }}
        run: pnpm run docs:version "$LABEL"
      - name: Push the branch
        if: steps.cut.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ steps.cut.outputs.branch }}
          VERSION: ${{ steps.cut.outputs.version }}
          LABEL: ${{ steps.cut.outputs.label }}
        run: |
          git switch --create "$BRANCH"
          # The three paths a cut writes, the pruned versions' removals
          # included.
          git add --all -- website/versioned_docs website/versioned_sidebars website/versions.json
          git status --short
          bot="${APP_SLUG}[bot]"
          id=$(gh api "users/$bot" --jq .id)
          git config user.name "$bot"
          git config user.email "$id+$bot@users.noreply.github.com"
          # No hooks: a hook planted by the checkout's code would receive the
          # token in this environment.
          git -c core.hooksPath=/dev/null commit -m "docs: version $VERSION" \
            -m "pnpm docs:version $LABEL, from $GITHUB_SHA."
          header=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            push origin "HEAD:refs/heads/$BRANCH"
      - name: Open the pull request
        if: steps.cut.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.cut.outputs.branch }}
          VERSION: ${{ steps.cut.outputs.version }}
          LABEL: ${{ steps.cut.outputs.label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The docs version $LABEL of reforged-ts $VERSION: \`pnpm docs:version $LABEL\` froze Next, from $GITHUB_SHA, into \`website/versioned_docs/version-$LABEL\`, and kept the last three minors of each major. Its merge deploys the site. Opened by [docs.yml]($RUN_URL)."
          if [ "$REHEARSAL" = true ]; then
            body="$body"$'\n\n'"**Rehearsal** (a dispatch): auto-merge is off. Close this pull request and delete its branch."
          fi
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
            --title "docs: version $VERSION" --body "$body")
          echo "Opened $url"
          # A rehearsal turns auto-merge off again at once: it proves the
          # step and never merges a throwaway version.
          gh pr merge --auto --squash "$url"
          if [ "$REHEARSAL" = true ]; then
            gh pr merge --disable-auto "$url"
            echo "Opened $url; auto-merge enabled, then disabled (rehearsal)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Opened $url with auto-merge (squash)." >> "$GITHUB_STEP_SUMMARY"
          fi
