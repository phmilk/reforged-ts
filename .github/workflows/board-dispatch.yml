# The board dispatch, reusable (`on: workflow_call`): tells the board
# (board.yml) to reconcile, from a Board repository other than this one,
# whose events never reach this repository (ADR 0017). It sends this
# repository a repository_dispatch of type board-repository-event with an
# empty payload: board.yml reads everything from GitHub on each run, so the
# dispatch carries no data and no authority beyond the hourly schedule's.
#
# The token is the GitHub App's, minted for this repository alone with
# contents write, which repository_dispatch needs. The job runs in the
# environment `board` of the calling repository, whose deployment branch
# policy admits its default branch alone and which holds the App's key, the
# secret APP_PRIVATE_KEY; the client ID is the caller's repository variable
# APP_CLIENT_ID. The caller passes the key by name: an environment secret
# reaches a called job only when its caller passes it, and is empty
# otherwise. Passed, the job receives the environment's value, which wins
# over a repository secret of the same name, and no repository secret is
# needed (#554). A caller off the list of Board repositories below is
# refused before the token is minted. No checkout and no install: the job
# runs the token action and gh alone, and no event value reaches a shell
# inline. release/test/board.test.ts holds this file to that, and the list
# equal to BOARD_REPOSITORIES in release/src/board.ts, minus this
# repository.
name: board-dispatch

on:
  workflow_call:
    secrets:
      # Required, so a direct caller that does not pass the key fails at
      # startup rather than as an empty key in the token action. Required
      # checks only that the key is passed, not its value: the claim check
      # always passes it on, so a claim caller that passes none still fails
      # in the token action.
      APP_PRIVATE_KEY:
        description: >
          The App's private key, passed by name from the caller; the job
          reads the value of the caller's environment board.
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The key's home, in the calling repository: its deployment branch
    # policy admits the default branch alone.
    environment: board
    permissions:
      contents: read
    steps:
      - name: Refuse a repository off the list
        env:
          REPOSITORY: ${{ github.repository }}
          # The Board repositories other than this one, space-separated.
          BOARD_REPOSITORIES: phmilk/reforged-ts-template
        run: |
          for board in $BOARD_REPOSITORIES; do
            if [ "$REPOSITORY" = "$board" ]; then exit 0; fi
          done
          echo "::error title=Not a Board repository::$REPOSITORY is not on the list of Board repositories in board-dispatch.yml of phmilk/reforged-ts; no token is minted for it. See docs/release.md, \"The board\"."
          exit 1
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # This repository alone, whatever repository calls.
          owner: phmilk
          repositories: reforged-ts
          permission-contents: write
      - name: Dispatch the board
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method POST repos/phmilk/reforged-ts/dispatches -f event_type=board-repository-event
