# The claim check of this repository: on every pull request, drafts
# included, when it opens, reopens, is pushed or is edited, on every
# assignment and unassignment of an issue, and on every edit of a Ticket
# (its criteria, #1084), it runs the reusable
# claim-check.yml, which holds the logic, the texts and the reasons for its
# run shape. The check reports as `claim / check`, a required check of the
# ruleset on master: renaming either job stops protecting master.
# docs/agents/issue-tracker.md, "Claim", holds the protocol.
name: claim

on:
  pull_request_target:
    # Drafts included: the collision begins at the draft. No base-branch
    # filter: a pull request into the Next branch, next, closes the issues
    # its body's closing keywords name (next-close.yml), which the check
    # reads there; one into any other branch closes nothing and passes.
    types: [opened, reopened, synchronize, edited]
  issues:
    # edited: a Ticket's body holds its criteria, which the check reads; the
    # called job skips an edit of any other issue.
    types: [assigned, unassigned, edited]

permissions:
  contents: read

jobs:
  claim:
    name: claim
    # The called jobs can only lower these: the checkout, the assignment and
    # the comment on the issue, the comment on the pull request (the check),
    # the dispatch of board.yml after an assignment (the dispatch job) and
    # the re-run of the check after a Ticket's edit (the rerun job), the two
    # that hold actions: write.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/claim-check.yml
