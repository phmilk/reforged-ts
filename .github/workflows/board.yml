# The board: the Claim board, a Projects board on the owner's account over
# phmilk/reforged-ts and phmilk/reforged-ts-template, kept true to GitHub by
# `pnpm board:reconcile`, its single writer: every open issue of both
# repositories gets a Status derived from its assignees, pull requests,
# blockers, sub-issues and labels, and only the differences are written. On
# this repository's issue and pull-request events, hourly (the Template's
# changes, a fork's pull request and the archive clock) and by hand.
# docs/release.md, "The board", describes the rules, this workflow and its
# failure modes.
#
# The writes need the maintainer's classic token, the secret PROJECT_TOKEN,
# since neither GITHUB_TOKEN nor the App reaches a user-owned project. The
# job checks out master explicitly, so that the token only ever runs the
# code master holds: a pull request's own release/src/board.ts never runs
# with it (the default checkout of a pull_request run would be its merge
# commit). A fork's pull request is skipped, since its run would hold no
# secret, and waits for the schedule. A dead token fails the run, and the
# red scheduled run is the signal.
name: board

on:
  issues:
    types:
      [
        opened,
        reopened,
        closed,
        deleted,
        transferred,
        assigned,
        unassigned,
        labeled,
        unlabeled,
      ]
  pull_request:
    types:
      [opened, reopened, closed, edited, converted_to_draft, ready_for_review]
  workflow_dispatch:
  schedule:
    # Hourly, off the hour.
    - cron: "37 * * * *"

permissions:
  contents: read

# One reconcile at a time; a newer event waits as the one pending run, which
# absorbs the events after it, since each run reads everything.
concurrency:
  group: board
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile
    # A fork's pull request runs without the secret: it waits for the schedule.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # master, never a pull request's merge commit: the token runs only the
      # code master holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      # No dependency cache: this job holds the token, and never restores a
      # cache another workflow could have written.
      - uses: ./.github/actions/setup-workspace
      - name: board:reconcile
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: pnpm board:reconcile
