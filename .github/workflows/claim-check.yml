# The claim check, reusable (`on: workflow_call`): on a pull request, the
# issues of the caller's repository that it closes are claimed for its
# author (an unclaimed one is assigned, with a reminder) or fail the check
# (one claimed by another login, the takeover path in the comment; a Spec,
# or an issue with an open blocker the pull request does not close too, ADR
# 0025), and the author joins each Ticket's Spec (assigned in the caller's
# repository; in the other Board repository, which github.token cannot
# write, a comment on the Ticket names the command), and a Ticket's criteria
# still unchecked fail the check, named in a comment on the pull request; on
# an assignment, a conflict, or a Claim of an unsplit Spec or a blocked
# issue, draws a comment on the issue. Adding to a Spec a login that holds or
# delivered one of its Tickets is not a conflict, nor is a login the
# maintainer adds. After an assignment it made, it tells the Claim board,
# from the library or from another Board repository (the jobs dispatch and
# board-dispatch). On an edit of a Ticket's body, the check of each open pull
# request that closes it runs again (the job rerun). It never reverts
# anything. The library's claim.yml and the Template's call it, so
# that the check reports as `claim / check` in both; the logic and the texts
# are release/src/claim-check.ts, the protocol docs/agents/issue-tracker.md,
# "Claim".
#
# The callers run it on pull_request_target, which holds a write token for
# a fork's pull request too (pull_request from a fork holds none), so that
# the author can be assigned and the comment written. That token is why the
# job never checks out the pull request's code: it checks out master of
# phmilk/reforged-ts (trusted code, in the Template's run too) and the
# script reads the event from its file, $GITHUB_EVENT_PATH; no event value
# reaches a shell inline. release/test/claim-check.test.ts holds this file
# to that.
name: claim-check

on:
  workflow_call:
    secrets:
      # The Template's caller passes it, for the job board-dispatch alone;
      # the library's caller passes none.
      APP_PRIVATE_KEY:
        description: >
          The App's private key, passed by name to board-dispatch.yml; that
          job reads the value of the caller's environment board.
        required: false

permissions:
  contents: read

jobs:
  check:
    name: check
    # A bot's pull request (Renovate's, the App's "Version Packages") is
    # outside the protocol: the job is skipped, which counts as success. An
    # edit matters on a Ticket alone, whose body holds its criteria (#1084):
    # an edit of any other issue starts no runner.
    if: (github.event_name != 'pull_request_target' || github.event.pull_request.user.type != 'Bot') && (github.event_name != 'issues' || github.event.action != 'edited' || contains(github.event.issue.labels.*.name, 'ticket'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The assignment, and the sticky comment on the issue.
      issues: write
      # The sticky comment on the pull request.
      pull-requests: write
      # On a Ticket's edit, the run of the check on each pull request's
      # head, which the job rerun starts again.
      actions: read
    # One run per pull request, a newer push or edit replacing the running
    # one; one per issue, every assignment and edit seen in order.
    concurrency:
      group: claim-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    outputs:
      # The issues the run assigned, comma-separated; empty when none.
      assigned: ${{ steps.pull-request.outputs.assigned }}
      # The runs of the check to start again, by id, comma-separated; empty
      # when none.
      rerun: ${{ steps.issue.outputs.rerun }}
    steps:
      # master of the library, never a ref of the pull request; named in
      # full, since a checkout in a called workflow defaults to the caller's
      # repository (the Template's, in its run).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phmilk/reforged-ts
          ref: master
          persist-credentials: false
      # Node alone, at the .node-version of the checkout: the script runs
      # with no install and no build, and no cache is restored.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: pull-request
        name: claim-check pull-request
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node release/src/claim-check.ts pull-request
      - id: issue
        name: claim-check issue
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node release/src/claim-check.ts issue

  # An assignment made with GITHUB_TOKEN raises no issues event, so the
  # board (board.yml) is told here, once the check says it assigned: in the
  # library, which holds board.yml, by this job; in another Board repository
  # by board-dispatch, below. A workflow_dispatch is the one event
  # GITHUB_TOKEN does start. Its own job, so that `actions: write` is held
  # by this one step and by nothing that reads the event; it runs when the
  # check failed too (one issue assigned, another claimed by someone else),
  # which `!cancelled()` allows and a plain `needs` would not.
  dispatch:
    name: dispatch
    needs: check
    if: ${{ !cancelled() && github.repository == 'phmilk/reforged-ts' && needs.check.outputs.assigned != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      # No checkout: gh needs the token and the workflow's name only.
      - name: Dispatch the board
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run board.yml --repo phmilk/reforged-ts

  # The same, from another Board repository (ADR 0017): its GITHUB_TOKEN
  # cannot start a workflow of the library, so it calls the reusable
  # board-dispatch.yml, which sends the library a repository dispatch with
  # the App's token, minted in the caller's environment `board`. The job
  # names the Board repositories other than the library, the list of
  # board-dispatch.yml, since that workflow fails red off its list: a fork
  # of the library, whose claim check runs too, skips it. Named in full, as
  # the checkout is: master of the library, whatever repository calls. Its
  # job holds `contents: read` alone, and passes the App's key on by name,
  # as the caller passed it here: the called job reads the environment's
  # value, not this one's.
  board-dispatch:
    name: board-dispatch
    needs: check
    if: ${{ !cancelled() && contains(fromJSON('["phmilk/reforged-ts-template"]'), github.repository) && needs.check.outputs.assigned != '' }}
    permissions:
      contents: read
    uses: phmilk/reforged-ts/.github/workflows/board-dispatch.yml@master
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # On an edit of a Ticket's body, the check of each open pull request that
  # closes it runs again (#1084): its criteria live in that body, which no
  # push or edit of the pull request touches, so ticking the boxes turns
  # the check green without a push. A re-run is not a new event, which
  # GITHUB_TOKEN may start. Its own job, as dispatch is, so that
  # `actions: write` is held by one step that reads no event value: the run
  # ids are the check job's output, numbers it read from the API. Each run
  # still going is waited for first, since a running run cannot be re-run
  # and may have read the body before the edit.
  rerun:
    name: rerun
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.rerun != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # No checkout: gh needs the token, the repository and the run ids.
      - name: Run the check of each pull request again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNS: ${{ needs.check.outputs.rerun }}
        run: |
          for run in ${RUNS//,/ }; do
            gh run watch "$run" --interval 5 > /dev/null || true
            gh run rerun "$run"
          done
