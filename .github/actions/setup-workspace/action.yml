name: Set up the workspace
description: >
  pnpm at the version of the root packageManager field, Node at the version
  of .node-version and a frozen install. No dependency cache unless the job
  opts in: a release job never restores a cache another workflow could have
  written.
inputs:
  cache:
    description: >
      Restore the pnpm store from the cache keyed on the lockfile, and save
      it after the job. CI opts in; the release never does.
    required: false
    default: "false"
  ignore-scripts:
    description: Skip the lifecycle scripts of the install, which build reforged-test.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        # The cache input alone decides: empty, it restores and saves
        # nothing, and the automatic cache of the packageManager field stays
        # off.
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
        package-manager-cache: false
    - name: Install
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = true ]; then
          pnpm install --frozen-lockfile --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
