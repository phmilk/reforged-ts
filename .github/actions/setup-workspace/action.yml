name: Set up the workspace
description: >
  pnpm at the version of the root packageManager field, Node 24 and a frozen
  install. No dependency cache: a release job never restores a cache another
  workflow could have written.
inputs:
  ignore-scripts:
    description: Skip the lifecycle scripts of the install, which build reforged-test.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = true ]; then
          pnpm install --frozen-lockfile --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
