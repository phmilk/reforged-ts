name: Mint the repository's GitHub App token
description: >
  A short-lived installation token of the repository's GitHub App, scoped to
  this repository (or to one or more other repositories of its owner the
  App is installed on) and to the permissions given. Fails naming the repository
  variable or the secret that is missing before trying. The calling job runs
  in the environment app, the secret's home.
inputs:
  client-id:
    description: The App's client ID, from the repository variable APP_CLIENT_ID.
    required: true
  private-key:
    description: >
      The App's private key, from the secret APP_PRIVATE_KEY of the
      environment app, whose deployment branch policy admits master alone.
    required: true
  repository:
    description: >
      The name of another repository of this one's owner to scope the token
      to, instead of this one (reforged-ts-template), or several,
      comma-separated (reforged-ts,reforged-ts-template); empty for this one.
    required: false
    default: ""
  permission-contents:
    description: read or write.
    required: true
  permission-pull-requests:
    description: read or write; empty for none.
    required: false
    default: ""
  permission-issues:
    description: read or write; empty for none.
    required: false
    default: ""
outputs:
  token:
    description: The installation token.
    value: ${{ steps.token.outputs.token }}
  app-slug:
    description: The App's slug; its commits are authored by <app-slug>[bot].
    value: ${{ steps.token.outputs.app-slug }}
runs:
  using: composite
  steps:
    - name: Check the App prerequisites
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        missing=()
        [ -n "$CLIENT_ID" ] || missing+=("the repository variable APP_CLIENT_ID")
        [ -n "$PRIVATE_KEY" ] || missing+=("the secret APP_PRIVATE_KEY of the environment app")
        if [ "${#missing[@]}" -gt 0 ]; then
          printf -v list '%s, ' "${missing[@]}"
          echo "::error title=GitHub App not configured::This job needs the repository's GitHub App (#48). Missing: ${list%, }. See docs/release.md, \"Repository variables and secrets\"."
          exit 1
        fi
    - id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        # Empty: this repository.
        repositories: ${{ inputs.repository }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-issues: ${{ inputs.permission-issues }}
